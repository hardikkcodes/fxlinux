# FxLinux — FxSound-alike audio enhancer sink
#
# Chain: Bass Enhancer -> Exciter -> Stereo Tools -> Reverb (ambience)
#        -> Multiband Compressor -> 8-band Parametric EQ -> Limiter (safety)
#
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "FxLinux"
            media.name       = "FxLinux"
            filter.graph = {
                nodes = [
                    {
                        type   = lv2
                        name   = bass
                        plugin = "http://calf.sourceforge.net/plugins/BassEnhancer"
                        control = {
                            "amount" = 2.0
                            "drive"  = 8.5
                        }
                    }
                    {
                        type   = lv2
                        name   = exciter
                        plugin = "http://calf.sourceforge.net/plugins/Exciter"
                        control = {
                            "amount" = 1.5
                        }
                    }
                    {
                        type   = lv2
                        name   = stereo
                        plugin = "http://calf.sourceforge.net/plugins/StereoTools"
                        control = {
                            "stereo_base" = 0.15
                        }
                    }
                    {
                        type   = lv2
                        name   = reverb
                        plugin = "http://calf.sourceforge.net/plugins/Reverb"
                        control = {
                            "amount" = 0.08
                            "dry"    = 1.0
                        }
                    }
                    {
                        type   = lv2
                        name   = mbcomp
                        plugin = "http://lsp-plug.in/plugins/lv2/mb_compressor_stereo"
                        control = {
                            # Always engaged; only band 0 (0-1kHz, covers
                            # bass + most vocal range) has a ratio above
                            # 1:1, so bands 1-7 stay fully transparent
                            # regardless.
                            "g_wet" = 1.0
                            "g_dry" = 0.0
                            # Band 0: gentle downward leveling so already-hot
                            # bass gets reined in automatically instead of
                            # needing the Bass slider retuned per track.
                            # Bass-light material stays below threshold and
                            # is untouched.
                            "cm_0"  = 0.0   # Down mode
                            "ce_0"  = 1.0   # enabled
                            "al_0"  = 0.35  # threshold ~-9dB
                            "cr_0"  = 2.0   # gentle 2:1 ratio
                            "rt_0"  = 200.0 # slower release, avoids pumping
                        }
                    }
                    {
                        type   = lv2
                        name   = eq
                        plugin = "http://lsp-plug.in/plugins/lv2/para_equalizer_x8_stereo"
                    }
                    {
                        type   = lv2
                        name   = limiter
                        plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
                        control = {
                            "g_in" = 1.15
                            "alr"  = 0.0
                            "th"   = 0.891
                            "lk"   = 10.0
                        }
                    }
                ]
                links = [
                    { output = "bass:out_l"    input = "exciter:in_l" }
                    { output = "bass:out_r"    input = "exciter:in_r" }
                    { output = "exciter:out_l" input = "stereo:in_l"  }
                    { output = "exciter:out_r" input = "stereo:in_r"  }
                    { output = "stereo:out_l"  input = "reverb:in_l"  }
                    { output = "stereo:out_r"  input = "reverb:in_r"  }
                    { output = "reverb:out_l"  input = "mbcomp:in_l"  }
                    { output = "reverb:out_r"  input = "mbcomp:in_r"  }
                    { output = "mbcomp:out_l"  input = "eq:in_l"      }
                    { output = "mbcomp:out_r"  input = "eq:in_r"      }
                    { output = "eq:out_l"      input = "limiter:in_l" }
                    { output = "eq:out_r"      input = "limiter:in_r" }
                ]
                inputs  = [ "bass:in_l" "bass:in_r" ]
                outputs = [ "limiter:out_l" "limiter:out_r" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "fxlinux_input"
                media.class = Audio/Sink
            }
            playback.props = {
                node.name    = "fxlinux_output"
                node.passive = true
            }
        }
    }
]
